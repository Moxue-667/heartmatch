  const LV = { 3: '必须', 2: '重要', 1: '加分', '-1': '不要' };
  const LV_COLOR = { 3: 'must', 2: 'imp', 1: 'plus', '-1': 'no' };

  /* ---------- 状态 ---------- */
  let state = load();

  let readsCat = 'all';  // 解读库当前分类
  function defaults() { return { name: '', picks: {}, tab: 'pick' }; }
  function load() {
    try { const v = JSON.parse(localStorage.getItem(LS)); return Object.assign(defaults(), v || {}); }
    catch (e) { return defaults(); }
  }
  function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

  const idsAt = lv => Object.keys(state.picks).filter(id => state.picks[id] === lv);
  const has = id => !!state.picks[id];
  const lvOf = id => state.picks[id] || 0;
  const labelOf = id => DB.byId[id] ? DB.byId[id].label : id;
  const catOf = id => DB.byId[id] ? DB.byId[id].cat : null;
  const readOf = id => {
    const c = DB.byId[id] ? DB.byId[id].cat : 'person';
    return Object.assign({}, READS.cat[c] || READS.cat.person, READS.tag[id] || {});
  };
  function toggle(id) {
    if (state.picks[id]) delete state.picks[id];
    else state.picks[id] = 2;
    save(); renderPick(); renderBadges();
  }
  function setLv(id, lv) {
    if (lv === 0) delete state.picks[id]; else state.picks[id] = lv;
    save(); renderPick(); renderBadges();
  }

  /* ---------- 画像生成 ---------- */
  const SENT = {
    person: ['性格底色', 'ta'],
    value: ['在乎的事', 'ta'],
    comm: ['相处方式', '你们'],
    love: ['亲密需求', 'ta'],
    life: ['日常节奏', 'ta'],
    interest: ['共同爱好', '你们']
  };

  function summarize() {
    const must = idsAt(3), imp = idsAt(2), plus = idsAt(1), no = idsAt(-1);
    if (!must.length && !imp.length) return '';
    const pick = (arr, cat, n) => arr.filter(id => catOf(id) === cat).slice(0, n).map(labelOf);
    const p = pick(must.concat(imp), 'person', 3);
    const v = pick(must.concat(imp), 'value', 2);
    const l = pick(must.concat(imp), 'life', 2);
    const parts = [];
    if (p.length) parts.push('性格上是「' + p.join('、') + '」的人');
    if (v.length) parts.push('把「' + v.join('、') + '」看得很重');
    if (l.length) parts.push('日常里「' + l.join('、') + '」');
    if (!parts.length) return '你的理想型画像还比较模糊，再选几个标签会更清晰。';
    let s = '你想要的 TA：' + parts.join('，') + '。';
    if (no.length) s += ' 但绝不能是「' + no.slice(0, 4).map(labelOf).join('、') + '」那种人。';
    return s;
  }

  function narrative() {
    const must = idsAt(3), imp = idsAt(2), plus = idsAt(1), no = idsAt(-1);
    const seg = [];
    const byCat = c => must.concat(imp).filter(id => catOf(id) === c).map(labelOf);
    const catText = (title, list, tpl) => { if (list.length) seg.push({ title, text: tpl.replace('{x}', list.slice(0, 6).join('、')) }); };
    catText('TA 的性格', byCat('person'), '你希望 TA 的性格底色是「{x}」。这意味着你想要的不是一个"完美的人"，而是一种让你放松下来的相处质感。');
    catText('你们怎么相处', byCat('comm').concat(byCat('love')), '在亲密与冲突里，你期待「{x}」。这些词决定了你们吵架后会冷战还是复盘，也决定了你累的时候 TA 会不会接住你。');
    catText('TA 看重什么', byCat('value'), '价值观上，你希望 TA 把「{x}」放在前面。这一维度的分歧很少在热恋期暴露，却常常在第一次大支出或第一次家庭冲突时引爆。');
    catText('日常画面', byCat('life'), '生活里，你想象的日常是「{x}」。这是"高频低烈度"的摩擦来源——吵不起来，但会持续磨损耐心。');
    catText('你们能一起做什么', byCat('interest'), '你希望和 TA 有「{x}」这样的共同出口。共同爱好是最低成本的相处燃料，也是最自然的破冰话题。');
    if (no.length) seg.push({ title: '绝对不能碰的红线', text: '你把「' + no.slice(0, 8).map(labelOf).join('、') + '」列为不要。这些不是"减分项"，而是"出现就出局"的底线——请在关系早期就确认，而不是等到投入之后。' });
    if (!seg.length) seg.push({ title: '还没成形', text: '先去「① 选词」页勾几个词，画像会自动长出来。' });
    if (seg.length < 2 && seg[0].title !== '还没成形') {
      const covered = new Set(Object.keys(state.picks).map(catOf));
      const missing = DB.cats.filter(c => !covered.has(c.id) && c.weight >= 0.9).map(c => c.name).slice(0, 3);
      if (missing.length) seg.push({ title: '目前的盲区', text: '你还没描述 TA 的「' + missing.join('、') + '」。这几维最容易在长期关系里变成分歧，建议至少各补 1–2 个词，画像才算完整。' });
    }
    return seg;
  }

  /* ---------- 冲突与稀有度 ---------- */
  function conflictCheck() {
    const out = [];
    const seen = new Set();
    const musts = idsAt(3), all = Object.keys(state.picks).filter(id => state.picks[id] > 0);
    const push = (msg, a, b) => {
      const k = [a, b].sort().join('|');
      if (seen.has(k)) return; seen.add(k);
      out.push({ msg, a, b });
    };
    // 手写规则
    IDEAL.conflicts.forEach(r => {
      if (state.picks[r.a] > 0 && state.picks[r.b] > 0) push(r.msg, r.a, r.b);
    });
    // 同一对的「必须」互斥（data.js 的互补对）
    DB.tags.forEach(t => {
      if (!t.opp || state.picks[t.id] !== 3 || state.picks[t.opp] !== 3) return;
      push('「' + labelOf(t.id) + '」和「' + labelOf(t.opp) + '」被同时列为必须——它们在现实中通常是相反的两端，建议只保留一个当必须，另一个降为加分。', t.id, t.opp);
    });
    // 必须 vs 不要 同标签
    Object.keys(state.picks).forEach(id => {
      if (state.picks[id] === -1) {
        // 无语义冲突，跳过
      }
    });
    // 必须项与红线自相矛盾（如 必须抽烟 + 不要抽烟 不可能，因为同一 id 只能一个层级）
    return out;
  }

  function rarity() {
    const must = idsAt(3), imp = idsAt(2);
    const samples = DB.samples;
    const rows = samples.map(s => {
      const hasT = id => s.tags.indexOf(id) >= 0;
      const mh = must.filter(hasT).length, ih = imp.filter(hasT).length;
      return {
        nick: s.nick, city: s.city, age: s.age, job: s.job,
        mustHit: mh, impHit: ih,
        mustRate: must.length ? mh / must.length : 1,
        impRate: imp.length ? ih / imp.length : 1
      };
    });
    rows.sort((a, b) => b.mustRate - a.mustRate || b.impRate - a.impRate);
    const perfect = rows.filter(r => r.mustRate === 1);
    // 概率估算：示例库频率 + 平滑，独立连乘
    const n = samples.length;
    const probs = must.map(id => (samples.filter(s => s.tags.indexOf(id) >= 0).length + 0.5) / (n + 1));
    const joint = probs.reduce((a, b) => a * b, 1);
    const per1000 = Math.round(joint * 1000 * 10) / 10;
    // 最罕见的必须项（建议降级）
    const freq = must.map(id => ({ id, p: (samples.filter(s => s.tags.indexOf(id) >= 0).length + 0.5) / (n + 1) }))
      .sort((a, b) => a.p - b.p);
    return { rows, perfect, per1000, freq, must, imp, text: IDEAL.rarityText(per1000) };
  }

  /* ---------- 反推：渠道 / 筛选 / 话题 ---------- */
  function channelsFor() {
    const picks = Object.keys(state.picks).filter(id => state.picks[id] > 0);
    const out = [];
    picks.forEach(id => { if (IDEAL.channels[id] && out.indexOf(IDEAL.channels[id]) < 0) out.push(IDEAL.channels[id]); });
    const catFallback = {
      interest: '兴趣类线下活动：同城活动平台、豆瓣同城、兴趣社群',
      work: '行业社群、校友会、行业会议',
      person: '朋友介绍、熟人局——性格类特质很难在陌生场合快速判断',
      value: '公益组织、读书会、宗教文化社群——价值观相近的人常聚在同类场景',
      life: '日常生活半径：常去的咖啡馆、健身房、宠物公园、菜市场',
      goal: '相亲介绍、婚恋平台——目标明确的人更常出现在明确找关系的场合',
      love: '朋友局、双人约会（爱语与依恋风格在熟人互动里更容易观察到）',
      comm: '小规模聚会、深度对话场合（读书会、工作坊），比喧闹场合更看得出沟通模式'
    };
    Object.keys(catFallback).forEach(c => {
      if (out.length >= 5) return;
      if (picks.some(id => catOf(id) === c)) out.push(catFallback[c]);
    });
    // 兜底：挑不出足够渠道时补通用建议
    const generic = [
      '同城兴趣活动（运动、手作、读书、观演）——比酒吧更容易遇到"有稳定爱好"的人',
      '朋友介绍 / 熟人局——对你明确在意的性格与价值观，这是最高效的筛选渠道',
      '婚恋平台（带真实资料与筛选条件）——适合目标明确、愿意直接谈婚育的人'
    ];
    while (out.length < 3 && generic.length) out.push(generic.shift());
    return out.slice(0, 7);
  }

  function screeningFor() {
    const must = idsAt(3);
    const list = must.map(id => ({ id, q: IDEAL.probes[id] || ('「' + labelOf(id) + '」这一点，你能举个最近发生在你身上的例子吗？」——用具体事例代替自我评价。') }));
    // 红线也要问
    idsAt(-1).forEach(id => list.push({ id, q: IDEAL.probes[id] || ('确认「' + labelOf(id) + '」：直接问，不要靠猜。') }));
    return list.slice(0, 10);
  }

  function topicsFor() {
    const picks = Object.keys(state.picks).filter(id => state.picks[id] > 0);
    const out = [];
    picks.forEach(id => { if (IDEAL.topics[id] && out.indexOf(IDEAL.topics[id]) < 0) out.push(IDEAL.topics[id]); });
    if (!out.length) out.push('「最近有什么让你特别投入、甚至忘了时间的事？」——比"你平时喜欢干嘛"有效十倍。');
    return out.slice(0, 5);
  }

      <div class="card">
        <h2>现实中这样的 TA 有多稀有？</h2>
        <div class="rarity-big"><b>${rr.per1000 >= 100 ? Math.round(rr.per1000 / 10) + '%' : rr.per1000}</b><span>${rr.per1000 >= 100 ? '人群中大约每 100 人有 ' + Math.round(rr.per1000 / 10) + ' 个' : '每 1000 人里约 ' + rr.per1000 + ' 人'}</span></div>
        <p class="hint">按你 ${mustN} 条必须项估算（基于 24 个示例档案的频率，独立连乘，只作数量级参考）。</p>
        <p>${esc(rr.text)}</p>
        ${rr.freq.length && rr.per1000 < 10 ? `<div class="alert warn"><b>建议降级的必须项</b><p>${rr.freq.slice(0, 3).map(f => '「' + esc(labelOf(f.id)) + '」').join('、')} 在示例库里最少见。把它们从"必须"降为"重要"，可匹配的人会多一个数量级。</p></div>` : ''}
        <h3>在 24 个示例档案里，完全满足必须项的人</h3>
        <div class="chips">${rr.perfect.length ? rr.perfect.map(p => `<span class="mini good">${esc(p.nick)} · ${esc(p.city)} · ${esc(p.job)}</span>`).join('') : '<span class="muted">没有一个人完全满足。这不代表现实中不存在，但说明清单偏严。</span>'}</div>
        <h3>最接近的 5 位</h3>
        <div class="near-list">${rr.rows.slice(0, 5).map(p => `<div class="near"><b>${esc(p.nick)}</b><span>${esc(p.city)} · ${esc(p.job)}</span><div class="track"><i style="width:${Math.round(p.mustRate * 100)}%"></i></div><em>必须 ${Math.round(p.mustRate * 100)}% · 重要 ${Math.round(p.impRate * 100)}%</em></div>`).join('')}</div>
      </div>

      <div class="card">
        <h2>该去哪找 TA？</h2>
        <p class="hint">根据你的兴趣、职业与价值观标签反推的高频场景。</p>
        <ul class="list">${ch.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      </div>

      <div class="card">
        <h2>第一次见面，怎么筛？</h2>
        <p class="hint">按你的"必须项"和"不要"，把问题问具体，别只听 TA 的自我评价。</p>
        <div class="probe-list">${sc.map(s => `<div class="probe"><span class="mini">${esc(labelOf(s.id))}</span><p>${esc(s.q)}</p></div>`).join('')}</div>
      </div>

      <div class="card">
        <h2>聊什么能破冰？</h2>
        <div class="probe-list">${tp.map(t => `<div class="probe"><p>${esc(t)}</p></div>`).join('')}</div>
      </div>
    `;
  }

  /* ---------- 渲染：④ 解读库 ---------- */
  function renderReads() {
    const root = q1('#panel-reads');
    root.innerHTML = `
      <div class="card">
        <div class="sec-head"><h2>④ 关键词解读库 <em class="muted">${DB.tags.filter(t => t.kind !== 'pref').length} 个词</em></h2>
          <div class="search-wrap"><input id="reads-search" placeholder="搜索：情绪稳定 / 依恋 / 想结婚"></div>
        </div>
        <p class="hint">每个词都回答三件事：想要它意味着什么、现实里怎么观察、可能付出什么代价。点开看。</p>
        <div id="reads-filter" class="chips" style="margin-bottom:10px"></div>
        <div id="reads-body"></div>
      </div>`;
    const body = q1('#reads-body');
    const filterBar = q1('#reads-filter');
    const renderBar = () => {
      const items = [{ id: 'all', icon: '🗂', name: '全部' }].concat(DB.cats.map(c => ({ id: c.id, icon: c.icon, name: c.name })));
      filterBar.innerHTML = items.map(c => `<span class="chip cat ${readsCat === c.id ? 'on' : ''}" data-rcat="${c.id}">${c.icon} ${c.name}</span>`).join('');
      qa1('[data-rcat]', filterBar).forEach(el => el.addEventListener('click', () => {
        readsCat = el.dataset.rcat; renderBar(); render(q1('#reads-search').value);
      }));
    };
    const render = kw => {
      const key = (kw || '').trim().toLowerCase();
      let html = '';
      DB.cats.forEach(c => {
        if (readsCat !== 'all' && readsCat !== c.id) return;
        const list = DB.tags.filter(t => t.cat === c.id && t.kind !== 'pref' &&
          (!key || t.label.toLowerCase().indexOf(key) >= 0 || t.id.indexOf(key) >= 0));
        if (!list.length) return;
        html += `<div class="group"><div class="group-head"><span class="g-icon">${c.icon}</span><b>${c.name}</b><small>${list.length} 个</small></div>
          <div class="chips">${list.map(t => `<span class="chip read ${README.has(t.id) ? 'key' : ''}" data-read="${t.id}">${esc(t.label)}${README.has(t.id) ? ' ⓘ' : ''}</span>`).join('')}</div></div>`;
      });
      body.innerHTML = html || '<p class="hint">没找到。</p>';
      body.querySelectorAll('[data-read]').forEach(el => el.addEventListener('click', () => showRead(el.dataset.read)));
    };
    renderBar();
    render('');
    q1('#reads-search').addEventListener('input', e => render(e.target.value));
  }
  const README = { has: id => !!(window.READS.tag[id]) };

  function showRead(id) {
    const r = readOf(id);
    const box = document.createElement('div');
    box.className = 'modal';
    box.innerHTML = `<div class="modal-box">
      <h3>${esc(labelOf(id))} <small class="muted">${esc((DB.byId[id] || {}).id || '')}</small></h3>
      <div class="read-box">
        <div><b>想要这个，意味着什么</b><p>${esc(r.want)}</p></div>
        <div><b>现实里怎么观察</b><p>${esc(r.check)}</p></div>
        <div><b>可能的代价</b><p>${esc(r.cost)}</p></div>
      </div>
      <div class="btn-row"><button class="btn primary" id="read-add">加入理想型</button><button class="btn ghost" id="read-close">关闭</button></div>
    </div>`;
    document.body.appendChild(box);
    const close = () => box.remove();
    box.addEventListener('click', e => { if (e.target === box) close(); });
    q1('#read-close', box).addEventListener('click', close);
    q1('#read-add', box).addEventListener('click', () => { if (!has(id)) toggle(id); close(); toast('已加入「重要」'); });
  }

  /* ---------- 工具 ---------- */
  function copy(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(() => toast('已复制')).catch(() => fallback(t));
    } else fallback(t);
    function fallback() {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('请手动复制'); }
      ta.remove();
    }
  }
  function toast(msg) {
    let t = q1('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000);
  }

  const renderers = { pick: renderPick, profile: renderProfile, check: renderCheck, reads: renderReads };
  function go(tab) {
    state.tab = tab; save();
    qa1('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    qa1('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
    renderers[tab]();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.addEventListener('DOMContentLoaded', () => {
    qa1('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
    go(state.tab || 'pick');
  });
})();

</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('tag-total');
    if (el && window.DB) el.textContent = window.DB.tags.filter(function (t) { return t.kind !== 'pref'; }).length;
  });
</script>
</body>
</html>
